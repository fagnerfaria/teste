name: Release

on:
  workflow_dispatch:
    inputs:
      build_current:
        type: boolean
        required: true
      draft:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-agentage-p53-lab
  cancel-in-progress: false

env:
  LAB_RELEASE_TAG: '0.12.4-lab.p53.20261121'
  LAB_RELEASE_COMMIT: 'a2529ae7357fb086590fcbe0bbfaa45f3db956bb'
  LAB_RELEASE_SHA256: |
    26047763419e4266830e12937c3ca33d1ca929f3c73c4ef9cca0af7c1c0450ed  main.js
    a08cacf35d6ded45af4a63796a6e3e3a5c1fbcb40c043014d42d82dd3ad0aea4  manifest.json
    978a5bb11ece14f8f2843c9e96d3396309bc3103328fdb72fee303ef5e4a8115  styles.css

jobs:
  build:
    name: Build the pinned lab source
    if: github.repository == 'fagnerfaria/teste' && github.ref == 'refs/heads/agentage-release-p53-20261121' && inputs.build_current && !inputs.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.LAB_RELEASE_TAG }}
          persist-credentials: false

      - name: Verify release source
        run: |
          test "$(git rev-parse HEAD)" = "$LAB_RELEASE_COMMIT"
          test "$(node -p "require('./manifest.json').version")" = "$LAB_RELEASE_TAG"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Pin npm for the project lockfile
        run: npm install --global --ignore-scripts npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify the assets
        run: |
          npm run build
          printf '%s\n' "$LAB_RELEASE_SHA256" | sha256sum --check --strict
          npm run check:hosts
          npm run check:docs
          npm run check:bundle

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: agentage-p53-release-assets
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    name: Attest and publish the lab assets
    needs: build
    permissions:
      contents: write # Create the lab pre-release.
      id-token: write # Request an identity token for signing.
      attestations: write # Store the signed release attestation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentage-p53-release-assets

      - name: Verify assets and check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LAB_RELEASE_SHA256" | sha256sum --check --strict
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$LAB_RELEASE_TAG" --jq .sha)" = "$LAB_RELEASE_COMMIT"
          RELEASE=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -c --arg tag "$LAB_RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty')
          if [ -z "$RELEASE" ]; then exit 0; fi
          EXPECTED=$(printf '%s\n' "$LAB_RELEASE_SHA256" |
            jq -Rn '[inputs | select(length > 0) | split("  ") | {key: .[1], value: ("sha256:" + .[0])}] | from_entries')
          if ! jq -e --argjson expected "$EXPECTED" '
            .draft == false and .prerelease == true and
            (.assets | length == ($expected | length) and
              all(.[]; .name as $name | ($expected | has($name)) and
                .state == "uploaded" and .digest == $expected[$name]) and
              ([.[].name] | unique | length) == ($expected | length))
          ' <<< "$RELEASE" >/dev/null; then
            echo "::error::Existing lab release does not match the expected assets and checksums."
            exit 1
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Attest the verified lab release source
        if: steps.existing.outputs.skip != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
          predicate-type: https://github.com/fagnerfaria/teste/attestations/lab-release/v1
          predicate: >-
            {"repository":"${{ github.repository }}","sourceCommit":"${{ env.LAB_RELEASE_COMMIT }}","sourceTag":"${{ env.LAB_RELEASE_TAG }}"}

      - name: Create lab pre-release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$LAB_RELEASE_TAG" --jq .sha)" = "$LAB_RELEASE_COMMIT"
          gh release create "$LAB_RELEASE_TAG" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title 'Agentage Sync P5.3 (teste de laboratório)' \
            --notes 'Publicação de laboratório para verificar retomada e integridade do bundle.'

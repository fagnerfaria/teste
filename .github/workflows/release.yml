name: Release

on:
  push:
    branches: [agentage-p54-npm-integrity-lab-20261122]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

concurrency:
  group: publish-agentage-p54-npm-integrity-lab
  cancel-in-progress: false

env:
  LAB_RELEASE_TAG: '0.12.4-lab.p53.20261122'
  LAB_OUTPUT_TAG: '0.12.4-lab.p54-npm.20261122'
  LAB_RELEASE_COMMIT: 'e85a0d6557564af8e0f47f2ea6368a8d0be19cc0'
  LAB_RELEASE_SHA256: |
    cf81dedaa6a80e1ec92da5d27c06c5e7940cb7646bd62bfd2e0e325dcffa8ca4  main.js
    480e6ab0deb5232e7d701c19360d58d6fb9f020c8e890d161a4b6d81c7eb5b0f  manifest.json
    978a5bb11ece14f8f2843c9e96d3396309bc3103328fdb72fee303ef5e4a8115  styles.css

jobs:
  build:
    name: Build the pinned lab source
    if: github.repository == 'fagnerfaria/teste' && github.ref == 'refs/heads/agentage-p54-npm-integrity-lab-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.LAB_RELEASE_TAG }}
          persist-credentials: false

      - name: Verify release source
        run: |
          test "$(git rev-parse HEAD)" = "$LAB_RELEASE_COMMIT"
          test "$(node -p "require('./manifest.json').version")" = "$LAB_RELEASE_TAG"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up npm 11.19.1 with verified integrity
        shell: bash
        run: |
          set -euo pipefail
          npm_dir=$(mktemp -d "${RUNNER_TEMP}/npm-11.19.1.XXXXXXXX")
          npm_archive="$npm_dir/npm.tgz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 60 --retry 2 \
            https://registry.npmjs.org/npm/-/npm-11.19.1.tgz --output "$npm_archive"
          expected_sha512=$(printf '%s' 'ztsxKxt/kkIaAs+2i0GU6I+DRmUdrNasxTZKJe9TCdSjKxlhah/4r/hl5ygMD6XAg1qZ9c2TNomR4qgOydp10g==' | base64 --decode | od -An -v -tx1 | tr -d ' \n')
          printf '%s  %s\n' "$expected_sha512" "$npm_archive" | sha512sum --check --strict
          tar -xzf "$npm_archive" --strip-components=1 -C "$npm_dir"
          test "$(node "$npm_dir/bin/npm-cli.js" --version)" = '11.19.1'
          mkdir "$npm_dir/path"
          ln -s ../bin/npm-cli.js "$npm_dir/path/npm"
          test "$("$npm_dir/path/npm" --version)" = '11.19.1'
          printf '%s\n' "$npm_dir/path" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify the assets
        run: |
          npm run build
          printf '%s\n' "$LAB_RELEASE_SHA256" | sha256sum --check --strict
          npm run check:hosts
          npm run check:docs
          npm run check:bundle

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: agentage-p53-release-assets
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    name: Attest and publish the lab assets
    needs: build
    permissions:
      contents: write # Create the lab pre-release.
      id-token: write # Request an identity token for signing.
      attestations: write # Store the signed release attestation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentage-p53-release-assets

      - name: Verify assets and check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LAB_RELEASE_SHA256" | sha256sum --check --strict
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$LAB_RELEASE_TAG" --jq .sha)" = "$LAB_RELEASE_COMMIT"
          OUTPUT_TARGET=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100" |
            jq -r --arg tag "$LAB_OUTPUT_TAG" '[.[][] | select(.name == $tag) | .commit.sha] | first // empty')
          if [ -n "$OUTPUT_TARGET" ]; then test "$OUTPUT_TARGET" = "$LAB_RELEASE_COMMIT"; fi
          RELEASE=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -c --arg tag "$LAB_OUTPUT_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty')
          if [ -z "$RELEASE" ]; then exit 0; fi
          EXPECTED=$(printf '%s\n' "$LAB_RELEASE_SHA256" |
            jq -Rn '[inputs | select(length > 0) | split("  ") | {key: .[1], value: ("sha256:" + .[0])}] | from_entries')
          if ! jq -e --argjson expected "$EXPECTED" '
            .draft == false and .prerelease == true and
            (.assets | length == ($expected | length) and
              all(.[]; .name as $name | ($expected | has($name)) and
                .state == "uploaded" and .digest == $expected[$name]) and
              ([.[].name] | unique | length) == ($expected | length))
          ' <<< "$RELEASE" >/dev/null; then
            echo "::error::Existing lab release does not match the expected assets and checksums."
            exit 1
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Attest the verified lab release source
        if: steps.existing.outputs.skip != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
          predicate-type: https://github.com/fagnerfaria/teste/attestations/lab-release/v1
          predicate: >-
            {"repository":"${{ github.repository }}","sourceCommit":"${{ env.LAB_RELEASE_COMMIT }}","sourceTag":"${{ env.LAB_RELEASE_TAG }}"}

      - name: Create lab pre-release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$LAB_RELEASE_TAG" --jq .sha)" = "$LAB_RELEASE_COMMIT"
          gh release create "$LAB_OUTPUT_TAG" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" --target "$LAB_RELEASE_COMMIT" --prerelease --latest=false \
            --title 'Agentage Sync P5.4 (teste de integridade do npm)' \
            --notes 'Pré-release de laboratório. Os arquivos reproduzem o candidato 0.12.4-lab.p53.20261122 usando o npm conferido antes da execução.'
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$LAB_OUTPUT_TAG" --jq .sha)" = "$LAB_RELEASE_COMMIT"

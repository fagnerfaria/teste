name: CodigoLab CI
on:
  push:
    branches: [codigolab, codigolab-complete-20261102]
  pull_request:
    branches: [codigolab]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codigolab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:content
      - run: npm run verify:curriculum
      - run: node scripts/worker-security.test.mjs
      - run: node scripts/monitor-check.mjs
      - run: npm run build
      - name: Navegador real com assets nativos, CSP e D1 local
        run: npm run qa
      - name: Dependências Python/npm, imports atualizados e limites de execução
        run: node scripts/runtime-dependencies-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: codigolab-verified-${{ github.sha }}
          path: dist
          retention-days: 14
  deploy:
    needs: check
    if: github.ref == 'refs/heads/codigolab' && vars.CF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codigolab-verified-${{ github.sha }}
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=codigolab --branch=codigolab

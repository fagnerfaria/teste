name: CodigoLab CI
on:
  push:
    branches: [codigolab]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test --passWithNoTests
      - name: Prepare static build in isolated branch
        run: |
          git config user.name "CodigoLab CI"
          git config user.email "actions@users.noreply.github.com"
          git switch -C codigolab-dist
          git add -f dist
          git commit -m "build: static files from validated source [skip ci]"
          git push origin HEAD:refs/heads/codigolab-dist --force

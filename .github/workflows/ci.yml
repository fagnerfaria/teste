name: CI

on:
  pull_request:
    branches: [agentage-prepare-p53-20261121]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 🔧 Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm for the project lockfile
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      # Kept from pr-validation.yml: `verify` does not include coverage.
      - name: Test with coverage
        run: npm run test:coverage
